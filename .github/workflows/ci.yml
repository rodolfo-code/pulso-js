name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: typecheck + lint + test
    runs-on: ubuntu-latest

    env:
      # Valor fake — necessário só pra prisma.config.ts não reclamar.
      # prisma generate lê apenas o schema, não toca no banco.
      # Substituir por service Postgres quando houver teste de integração.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_fake?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
